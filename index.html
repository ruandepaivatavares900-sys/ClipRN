<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipRN</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:#f7f7f7;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:360px;
    background:#fff;
    border-radius:20px;
    padding:35px;
    box-shadow:0 15px 40px rgba(0,0,0,.12);
}

.logo{
    width:80px;
    height:80px;
    margin:auto;
    border-radius:50%;
    background:#ff7a00;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    font-weight:bold;
}

h1{
    text-align:center;
    color:#ff7a00;
    margin-top:20px;
}

.sub{
    text-align:center;
    color:#666;
    margin:10px 0 30px;
}

label{
    color:#444;
    font-weight:600;
    display:block;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:14px;
    border:2px solid #ffe0c2;
    border-radius:12px;
    margin-bottom:18px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#ff7a00;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#ff7a00;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#e86800;
}

.links{
    display:flex;
    justify-content:space-between;
    margin-top:18px;
}

.links a{
    color:#ff7a00;
    text-decoration:none;
    font-size:14px;
}

.divisor{
    text-align:center;
    margin:25px 0;
    color:#888;
}

.google{
    background:#fff;
    color:#333;
    border:2px solid #ddd;
}

.google:hover{
    background:#f3f3f3;
}

.rodape{
    margin-top:25px;
    text-align:center;
    color:#888;
    font-size:13px;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">C</div>

<h1>ClipRN</h1>

<p class="sub">
Conectando clipadores e anunciantes.
</p>

<form>

<label>E-mail</label>
<input type="email" placeholder="Digite seu e-mail">

<label>Senha</label>
<input type="password" placeholder="Digite sua senha">

<button type="submit">Entrar</button>

</form>

<div class="divisor">ou</div>

<button class="google">
Entrar com Google
</button>

<div class="links">
<a href="#">Criar conta</a>
<a href="#">Esqueci a senha</a>
</div>

<div class="rodape">
© 2026 ClipRN. Todos os direitos reservados.
</div>

</div>

</body>
</html>
